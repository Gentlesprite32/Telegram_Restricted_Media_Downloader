name: Test Nuitka Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Set up Python 3.13.2
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.2'

    - name: Install Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install nuitka==4.1.3

    - name: Create hello.py
      shell: pwsh
      run: |
        Set-Content -Path hello.py -Value 'print("Hello World")'

    - name: Build with Nuitka
      shell: pwsh
      run: |
        python -m nuitka --onefile --msvc=latest --assume-yes-for-downloads --output-dir=build hello.py

    - name: Run hello.exe
      shell: pwsh
      run: |
        .\build\hello.exe
