name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签,例如 v2.0.1'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.13.2
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.2'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka==2.6.7

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Verify MSVC
      shell: bash
      run: |
        which cl || { echo 'cl.exe 不在 PATH 中,MSVC 环境未激活。'; exit 1; }
        echo "VCINSTALLDIR=$VCINSTALLDIR"

    - name: Extract metadata
      shell: bash
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          TAG_NAME="${{ inputs.tag }}"
        else
          TAG_NAME=${GITHUB_REF#refs/tags/}
        fi
        CLEAN_VERSION=${TAG_NAME#v}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

    - name: Build with Nuitka
      shell: bash
      run: |
        python build.py

    - name: Prepare release files
      shell: bash
      run: |
        mkdir -p "release\使用手册"
        cp "output\TRMD.exe" "release\TRMD.exe"
        cp "res\使用必读.pdf" "release\使用手册\使用必读.pdf"
        cp "res\Wiki.pdf" "release\使用手册\常见问题及解决方案汇总.pdf"
        cp "res\2_5_1.png" "release\使用手册\软件更新教程.png"
        cd release
        "..\res\bin\rar.exe" a "TRMD_${{ env.CLEAN_VERSION }}-windows-64.rar" "TRMD.exe" "使用手册"
        rm -rf "使用手册"

    - name: Upload release asset to GitHub
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: release/*
