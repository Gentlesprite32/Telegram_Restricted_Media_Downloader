name: test

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 eg. x.x.x(.x)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Extract metadata
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="v${{ github.event.inputs.version }}"
          VERSION_ARG="--version=${{ github.event.inputs.version }}"
        else
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION_ARG=""
        fi
        CLEAN_VERSION=${TAG_NAME#v}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
        echo "VERSION_ARG=$VERSION_ARG" >> $GITHUB_ENV



    - name: Prepare release files
      shell: bash
      run: |
        mkdir -p "release\使用手册"
        cp "res\使用必读.pdf" "release\使用手册\使用必读.pdf"
        cp "res\Wiki.pdf" "release\使用手册\常见问题及解决方案汇总.pdf"
        cp "res\2_5_1.png" "release\使用手册\软件更新教程.png"
        cd release
        "..\res\bin\rar.exe" a "TRMD_${{ env.CLEAN_VERSION }}-windows-64.rar" "使用手册"
        rm -rf "使用手册"

    - name: Upload release asset to GitHub
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: release/*
